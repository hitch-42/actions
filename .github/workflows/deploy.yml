name: Deploy Hitch applets

on:
  workflow_call:
    inputs:
      hitch_url:
        description: Hitch application origin
        required: false
        type: string
        default: https://app.hitch42.com

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cancellation is the only guard against a stale release: a newer push
    # cancels this run before it can finish another build and upload.
    concurrency:
      group: hitch-applets-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      # The SDK pin decides what pnpm downloads; the lockfile is generated.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/node/corepack
            ~/.cache/pnpm/dlx
            ~/.local/share/pnpm/store
          key: hitch-pnpm-${{ runner.os }}-${{ hashFiles('hitch.config.ts') }}
          restore-keys: hitch-pnpm-${{ runner.os }}-
      - name: Deploy applets
        env:
          HITCH_API_URL: ${{ inputs.hitch_url }}
        run: |
          sdk="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("hitch.config.ts", "utf8");
          const match = source.match(/^\s*sdk:\s*["']([^"']+)["']\s*,?\s*$/m);
          if (!match) throw new Error("hitch.config.ts must contain a string sdk field.");
          process.stdout.write(match[1]);
          NODE
          )"
          corepack enable
          pnpm dlx "${sdk}" deploy
