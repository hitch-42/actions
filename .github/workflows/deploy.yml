name: Deploy Hitch applets

on:
  workflow_call:
    inputs:
      hitch_url:
        description: Hitch application origin
        required: false
        type: string
        default: https://app.hitch42.com

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cancellation is the only guard against a stale release: a newer push
    # cancels this run before it can finish another build and upload.
    concurrency:
      group: hitch-applets-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Restore workspace support
        run: |
          sdk="$(
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const source = readFileSync("hitch.config.ts", "utf8");
          const match = source.match(/^\s*sdk:\s*["']([^"']+)["']\s*,?\s*$/m);
          if (!match) throw new Error("hitch.config.ts must contain a string sdk field.");
          process.stdout.write(match[1]);
          NODE
          )"
          corepack enable
          pnpm dlx --allow-build=esbuild --allow-build=workerd "${sdk}" bootstrap
      # The SDK reads the job's OIDC token, fetches the build inputs, builds
      # every applet under applets/, and uploads each release.
      - name: Deploy applets
        env:
          HITCH_API_URL: ${{ inputs.hitch_url }}
        run: pnpm exec applet deploy
