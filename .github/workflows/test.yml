name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Bootstrap a clean workspace
        working-directory: test-fixture
        run: |
          corepack enable
          pnpm dlx --allow-build=esbuild --allow-build=workerd @hitch42/applet@0.1.0-beta.3 bootstrap --no-install
